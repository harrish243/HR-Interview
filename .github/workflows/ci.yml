name: HR Interview CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build HR Interview Application
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build the application
      - name: Build application
        run: npm run build

      # Step 5: Check the generated files
      - name: List build output
        run: ls -la dist

      # Step 6: Display success message
      - name: CI completed
        run: echo "HR Interview application built successfully!"
